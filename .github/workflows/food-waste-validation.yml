name: Food waste pipeline validation
on:
  pull_request:
  push:
    branches: [main, fix/food-waste-pipeline]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: validation
          MYSQL_DATABASE: prepiq_validation
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pvalidation"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      PREPIQ_TEST_MYSQL_URL: mysql+aiomysql://root:validation@127.0.0.1:3306/prepiq_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/ -q -ra
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
        env:
          CI: 'true'
      - run: npm run build
        working-directory: frontend
        env:
          CI: 'false'
      # Mobile lockfiles are ignored by this repository; use its install convention.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
